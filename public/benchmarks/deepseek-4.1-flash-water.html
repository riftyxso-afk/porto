<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Simulasi Air - Gerstner + Refraksi Layar</title>
<style>
  :root {
    --ink: #050d13;
    --line: rgba(150, 190, 205, 0.16);
    --text: #dce9ef;
    --text-dim: #93aab7;
    --accent: #4d6bfe;
    --accent-deep: #3b57e0;
    --radius-panel: 8px;
    --radius-ctl: 5px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    overscroll-behavior: none;
  }

  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* Satu-satunya elemen dengan elevasi di halaman ini: panel mengapung di atas kanvas 3D. */
  #panel {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 276px;
    max-height: calc(100dvh - 28px);
    display: flex;
    flex-direction: column;
    background: rgba(6, 15, 22, 0.9);
    border: 1px solid var(--line);
    border-radius: var(--radius-panel);
    box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.9);
    z-index: 10;
  }

  #panel-head { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }

  /* Logo inline, bukan <img>: halaman tetap satu file tanpa aset eksternal. */
  .brand { display: block; height: 21px; width: auto; color: var(--accent); }

  h1 { font-size: 13px; font-weight: 600; margin: 10px 0 0; line-height: 1.2; }
  .model { margin: 3px 0 0; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
  .sub { margin: 7px 0 0; font-size: 11px; line-height: 1.45; color: var(--text-dim); }

  #presets { display: flex; gap: 4px; margin-top: 10px; }
  .preset {
    flex: 1 1 0;
    min-height: 44px;
    padding: 6px 4px;
    font: inherit;
    font-size: 10.5px;
    line-height: 1.2;
    color: var(--text-dim);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
    border-radius: var(--radius-ctl);
    cursor: pointer;
    transition: color 140ms ease, border-color 140ms ease, background-color 140ms ease;
  }
  .preset:hover { color: var(--text); border-color: rgba(150, 190, 205, 0.34); }
  .preset[aria-pressed="true"] {
    color: #fff;
    background: var(--accent-deep);
    border-color: var(--accent);
    font-weight: 600;
  }
  .preset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 12px 14px; }
  #panel-body::-webkit-scrollbar { width: 8px; }
  #panel-body::-webkit-scrollbar-thumb { background: rgba(150, 190, 205, 0.2); border-radius: 4px; }

  .group { padding-top: 10px; }
  .group > h2 {
    margin: 0 0 7px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--text-dim);
  }
  .row { margin-bottom: 7px; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .row-head label { font-size: 11.5px; color: var(--text); }
  .row-head output { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; height: 18px; margin: 0;
    background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: rgba(150, 190, 205, 0.22); border-radius: 2px; }
  input[type="range"]::-moz-range-track { height: 3px; background: rgba(150, 190, 205, 0.22); border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; margin-top: -5px;
    background: var(--text); border: 0; border-radius: 50%;
  }
  input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; background: var(--text); border: 0; border-radius: 50%; }
  input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .color-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .color-row label { font-size: 11.5px; }
  input[type="color"] {
    -webkit-appearance: none; appearance: none;
    width: 46px; height: 26px; padding: 0;
    background: none; border: 1px solid var(--line-strong, rgba(150, 190, 205, 0.28));
    border-radius: var(--radius-ctl); cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 3px; }
  input[type="color"]::-moz-color-swatch { border: 0; border-radius: 3px; }
  input[type="color"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #readout {
    margin-top: 10px; padding-top: 9px;
    border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10px; line-height: 1.6; color: var(--text-dim);
  }

  #notice {
    position: fixed; inset: 0; z-index: 20;
    display: none; place-items: center;
    padding: 24px;
    background: rgba(5, 13, 19, 0.94);
    text-align: center;
  }
  #notice.on { display: grid; }
  #notice h2 { margin: 0 0 8px; font-size: 15px; }
  #notice p { margin: 0; max-width: 42ch; font-size: 12.5px; line-height: 1.6; color: var(--text-dim); }
  #notice code { font-family: var(--mono); color: var(--text); }

  #panel-toggle { display: none; }

  @media (max-width: 720px) {
    #panel {
      top: auto; right: 8px; left: 8px; bottom: 8px; width: auto;
      max-height: 56dvh;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    #panel-head { padding: 10px 10px 8px; }
    #panel-body { padding: 4px 10px 12px; }
    #panel[data-collapsed="true"] #panel-body,
    #panel[data-collapsed="true"] #presets { display: none; }
    #panel[data-collapsed="true"] { max-height: none; }
    #panel-toggle {
      display: block; width: 100%; min-height: 40px; margin-top: 8px;
      font: inherit; font-size: 11.5px; font-weight: 600; color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line); border-radius: var(--radius-ctl); cursor: pointer;
    }
    #panel-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  }
</style>
</head>

function deepMerge(target, patch) {
  for (const key of Object.keys(patch)) {
    const value = patch[key];
    if (value && typeof value === 'object' && !Array.isArray(value) && target[key] && typeof target[key] === 'object') {
      deepMerge(target[key], value);
    } else {
      target[key] = value;
    }
  }
  return target;
}

const NOISE_GLSL = /* glsl */ `
// Hash tanpa tekstur: tiga sinusoidal frekuensi berbeda dijumlahkan, cukup acak untuk normal map.
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}

float valueNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float sum = 0.0;
  float amp = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) {
    sum += amp * valueNoise(p);
    p = rot * p * 2.02;
    amp *= 0.5;
  }
  return sum;
}

// Beda hingga pada fbm: dipakai untuk menurunkan normal map dari ketinggian prosedural.
vec2 fbmGradient(vec2 p, float eps) {
  float h = fbm(p);
  float hx = fbm(p + vec2(eps, 0.0));
  float hy = fbm(p + vec2(0.0, eps));
  return vec2(hx - h, hy - h) / eps;
}
`;

const WAVE_GLSL = /* glsl */ `
// Satu lapis gelombang Gerstner: menggeser XY dan mengangkat Y, dengan puncak lebih tajam dari lembah.
void gerstner(vec2 pos, vec2 dir, float steepness, float wavelength, float speed, float time, inout vec3 offset) {
  float k = 6.28318530718 / max(wavelength, 0.0001);
  float a = steepness / k;
  vec2 d = normalize(dir);
  float phase = k * dot(d, pos) - speed * k * time;
  float s = sin(phase);
  float c = cos(phase);
  offset.x += d.x * a * c;
  offset.z += d.y * a * c;
  offset.y += a * s;
}

// Tiga lapis gelombang berbeda arah dan skala, dijumlahkan pada satu titik.
vec3 gerstnerSum(vec2 pos, float time, float amp, float freq, float speed, float steepness) {
  vec3 offset = vec3(0.0);
  float base = max(freq, 0.0001);
  gerstner(pos, vec2(1.0, 0.22), steepness, 1.0 / base * 7.4, speed, time, offset);
  gerstner(pos, vec2(-0.65, 0.76), steepness * 0.72, 1.0 / base * 4.1, speed * 1.35, time, offset);
  gerstner(pos, vec2(0.18, -0.98), steepness * 0.5, 1.0 / base * 2.3, speed * 1.9, time, offset);
  return offset * amp;
}
`;

const WATER_VERTEX = /* glsl */ `
precision highp float;

uniform float uTime;
uniform float uAmplitude;
uniform float uFrequency;
uniform float uSpeed;
uniform float uSteepness;

varying vec3 vWorldPos;
varying vec3 vWorldNormal;
varying float vCrest;

${NOISE_GLSL}
${WAVE_GLSL}

void main() {
  vec4 worldOrigin = modelMatrix * vec4(position, 1.0);
  vec2 basePos = worldOrigin.xz;

  vec3 offset = gerstnerSum(basePos, uTime, uAmplitude, uFrequency, uSpeed, uSteepness);
  vec3 displaced = worldOrigin.xyz + offset;

  // Normal analitik: beda hingga arah X dan Z dari posisi terdisplacement.
  float eps = 0.35;
  vec3 px = vec3(basePos.x + eps, 0.0, basePos.y) + gerstnerSum(basePos + vec2(eps, 0.0), uTime, uAmplitude, uFrequency, uSpeed, uSteepness);
  vec3 pz = vec3(basePos.x, 0.0, basePos.y + eps) + gerstnerSum(basePos + vec2(0.0, eps), uTime, uAmplitude, uFrequency, uSpeed, uSteepness);
  vec3 tangentX = px - displaced;
  vec3 tangentZ = pz - displaced;
  vec3 normal = normalize(cross(tangentZ, tangentX));

  // Keruncingan puncak: dipakai untuk mempertajam buih dan kilau matahari.
  vCrest = smoothstep(0.35, 1.0, offset.y / max(uAmplitude * 1.15, 0.0001));

  vWorldPos = displaced;
  vWorldNormal = normal;

  gl_Position = projectionMatrix * viewMatrix * vec4(displaced, 1.0);
}
`;

const WATER_FRAGMENT = /* glsl */ `
precision highp float;

uniform float uTime;
uniform vec3 uShallowColor;
uniform vec3 uDeepColor;
uniform vec3 uTintColor;
uniform vec3 uSunColor;
uniform vec3 uSunDirection;
uniform vec3 uCameraPosition;
uniform vec2 uResolution;
uniform float uAmplitude;
uniform float uDepthScale;
uniform float uOpacity;
uniform float uNormalScale;
uniform float uNormalStrength;
uniform float uNormalScroll;
uniform float uCrossAngle;
uniform float uFresnelIntensity;
uniform float uFresnelPower;
uniform float uFoamThreshold;
uniform float uFoamSoftness;
uniform float uFoamIntensity;
uniform float uFoamNoiseScale;
uniform float uFoamScroll;
uniform float uSunIntensity;
uniform float uSunSharpness;
uniform float uSparkle;
uniform float uRefractionStrength;
uniform float uRefractionFalloff;
uniform float uBaseDepth;
uniform sampler2D uScreenTexture;
uniform int uEnvMode;
uniform vec3 uSkyZenith;
uniform vec3 uSkyHorizon;

varying vec3 vWorldPos;
varying vec3 vWorldNormal;
varying float vCrest;

${NOISE_GLSL}

// Detail permukaan: dua lapis fbm bergerak berlawanan, digabung jadi vektor tangen.
// eps harus jauh lebih kecil dari satu sel noise, kalau tidak gradiennya jadi bintik acak.
vec3 detailNormal(vec2 p, float fade) {
  vec2 a = p * uNormalScale + vec2(uTime * uNormalScroll, uTime * uNormalScroll * 0.6);
  vec2 b = p * uNormalScale * 1.37 + vec2(-uTime * uNormalScroll * 0.8, uTime * uNormalScroll * 1.1);
  b = mat2(cos(uCrossAngle), -sin(uCrossAngle), sin(uCrossAngle), cos(uCrossAngle)) * b;

  vec2 gradA = fbmGradient(a, 0.06);
  vec2 gradB = fbmGradient(b, 0.05);
  vec2 grad = (gradA * 0.62 + gradB * 0.52) * uNormalStrength * 2.0 * fade;
  return normalize(vec3(-grad.x, 1.0, -grad.y));
}

vec3 proceduralSky(vec3 dir) {
  float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 sky = mix(uSkyHorizon, uSkyZenith, smoothstep(0.0, 0.85, h));
  float sun = pow(max(dot(dir, uSunDirection), 0.0), 900.0);
  return sky + uSunColor * sun * 2.5;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;

  // Kedalaman: tinggi air di atas dasar, dinormalkan ke kedalaman dasar supaya
  // slider tetap terasa sama saat kedalaman dasar diubah.
  float depth = uBaseDepth - vWorldPos.y;
  float depthNorm = clamp(depth / max(uBaseDepth, 0.001), 0.0, 1.0);
  float depthT = 1.0 - exp(-depthNorm * uDepthScale * 3.0);

  vec3 N = normalize(vWorldNormal);
  vec3 V = normalize(uCameraPosition - vWorldPos);
  float viewDist = length(uCameraPosition - vWorldPos);

  // Detail mikro memudar dengan jarak: tanpa ini permukaan jauh berubah jadi bintik acak.
  float detailFade = 1.0 - smoothstep(12.0, 95.0, viewDist);
  vec3 detail = detailNormal(vWorldPos.xz, detailFade);
  N = normalize(N + vec3(detail.x, 0.0, detail.z) * 0.6);

  // Buih: puncak gelombang dihaluskan dulu, baru digerbangi ambang. Tanpa
  // penghalusan ini vCrest yang tajam berubah jadi bercak putih raksasa.
  float crest = smoothstep(0.55, 1.0, vCrest);
  vec2 foamCoord = vWorldPos.xz * uFoamNoiseScale + vec2(uTime * uFoamScroll, uTime * uFoamScroll * 0.4);
  float foamNoise = fbm(foamCoord);
  float foamField = crest * (0.55 + foamNoise * 0.6);
  float foam = smoothstep(uFoamThreshold, uFoamThreshold + max(uFoamSoftness, 0.001), foamField);
  foam *= uFoamIntensity * smoothstep(0.05, 0.9, depth);

  // Refraksi: distorsi UV layar berdasarkan kedalaman dan kemiringan permukaan.
  vec2 refractOffset = vec2(N.x, N.z) * uRefractionStrength * 0.06;
  refractOffset *= exp(-max(depth, 0.0) * uRefractionFalloff);
  vec2 refractUv = clamp(uv + refractOffset, vec2(0.002), vec2(0.998));
  vec3 behind = texture2D(uScreenTexture, refractUv).rgb;

  // Fresnel: rasio pantulan naik saat sudut pandang makin landai.
  float fresnel = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), uFresnelPower);
  fresnel = clamp(fresnel * uFresnelIntensity, 0.0, 1.0);

  // Warna air: kedalaman dicampur warna dasar, lalu diwarnai pantulan langit.
  // Puncak gelombang memakai air lebih tipis, jadi ikut menarik warna dangkal.
  float heightT = clamp((vWorldPos.y + uAmplitude) / max(uAmplitude * 2.0, 0.0001), 0.0, 1.0);
  float shallowMix = mix(depthT, heightT, 0.42);
  vec3 waterTint = mix(uShallowColor, uDeepColor, shallowMix);
  vec3 reflected = uEnvMode == 0
    ? mix(uTintColor, proceduralSky(reflect(-V, N)), 0.7)
    : vec3(0.05, 0.07, 0.09);
  vec3 body = mix(waterTint, reflected, fresnel);

  // Kilau matahari: dua lobus, satu lebar untuk gelombang besar, satu tajam untuk sparkle.
  vec3 H = normalize(uSunDirection + V);
  float nh = max(dot(N, H), 0.0);
  float specBroad = pow(nh, max(uSunSharpness * 0.1, 1.0));
  float specSharp = pow(nh, max(uSunSharpness, 1.0));
  float sparkleNoise = fbm(vWorldPos.xz * 9.0 + uTime * 1.1);
  float sparkleMask = mix(1.0, smoothstep(0.5, 0.92, sparkleNoise), uSparkle);
  vec3 specular = uSunColor * uSunIntensity * (specBroad * 0.2 + specSharp * 1.6 * sparkleMask);
  specular *= smoothstep(0.0, 0.35, uSunDirection.y);
  // Spekular dipadamkan dengan jarak: highlight jauh berubah jadi titik yang berkedip.
  specular *= 1.0 - smoothstep(20.0, 130.0, viewDist);

  vec3 color = mix(behind, body, uOpacity);
  color += specular * mix(0.35, 1.0, fresnel);
  color = mix(color, vec3(0.94, 0.97, 0.99), clamp(foam, 0.0, 1.0) * 0.92);

  // Kabut jarak: air jauh melebur ke langit, jadi cakrawala tidak berhenti di
  // garis lurus yang membocorkan bentuk bidang.
  float haze = smoothstep(60.0, 240.0, viewDist);
  color = mix(color, uSkyHorizon, haze * 0.85);

  gl_FragColor = vec4(color, 1.0);
}
`;

const UNDERWATER_FRAGMENT = /* glsl */ `
precision highp float;
uniform float uTime;
uniform vec3 uShallowColor;
uniform vec3 uDeepColor;
uniform float uWaveAmp;
varying vec2 vUv;

// Grid dasar laut. Lebar garis tetap di ruang UV, lalu dilunturkan oleh jarak
// supaya tidak berkedip saat kamera bergerak.
float gridLines(vec2 uv, float cells, float width, float fade) {
  vec2 cell = uv * cells;
  vec2 d = abs(fract(cell - 0.5) - 0.5);
  float line = min(d.x, d.y);
  return (1.0 - smoothstep(0.0, width, line)) * fade;
}

void main() {
  vec2 centered = (vUv - 0.5) * 2.0;
  float r = length(centered);

  // Gradasi radial: pasir terang di pusat, makin gelap ke luar.
  vec3 sand = mix(vec3(0.36, 0.31, 0.24), vec3(0.1, 0.12, 0.13), smoothstep(0.0, 1.0, r));
  vec3 base = mix(sand, uDeepColor, 0.35);

  // Dua lapis grid beda skala: yang halus jadi detail, yang kasar jadi penanda jarak.
  float fade = 1.0 - smoothstep(0.35, 0.9, r);
  float fine = gridLines(vUv, 46.0, 0.055, fade) * 0.18;
  float coarse = gridLines(vUv, 9.0, 0.012, fade) * 0.34;
  base += vec3(0.16, 0.26, 0.3) * (fine + coarse);

  // Caustic bergerak, menguat saat gelombang besar.
  float caustic = sin(vUv.x * 34.0 + uTime * 0.7) * sin(vUv.y * 27.0 - uTime * 0.5);
  caustic = pow(max(caustic * 0.5 + 0.5, 0.0), 3.0) * 0.3;
  base += vec3(0.3, 0.5, 0.55) * caustic * clamp(uWaveAmp * 2.0, 0.0, 1.0);

  gl_FragColor = vec4(base, 1.0);
}
`;

let seed = 20261013;
function rand() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}

for (let i = 0; i < 22; i++) {
  const angle = rand() * Math.PI * 2;
  const radius = 3 + rand() * 30;
  const rock = new THREE.Mesh(rockGeometry, rockMaterial);
  const scale = 0.5 + rand() * 2.2;
  rock.scale.set(scale, scale * (0.5 + rand() * 0.7), scale);
  rock.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
  rock.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
  rocks.add(rock);
}

const seabedLight = new THREE.DirectionalLight(0xd8f0ff, 2.4);
seabedLight.position.set(6, 20, 8);
scene.add(seabedLight);
scene.add(new THREE.AmbientLight(0x4a7288, 1.6));

// --- Sinkronisasi parameter ke uniform --------------------------------------

function applyWaves() {
  uniforms.uAmplitude.value = P.waves.amplitude;
  uniforms.uFrequency.value = P.waves.frequency;
  uniforms.uSpeed.value = P.waves.speed;
  uniforms.uSteepness.value = P.waves.steepness;
  uniforms.uBaseDepth.value = P.waves.baseDepth;
  seabed.position.y = -P.waves.baseDepth;
  for (const rock of rocks.children) rock.position.y = -P.waves.baseDepth + rock.scale.y * 0.35;
}

function applySun() {
  const az = THREE.MathUtils.degToRad(P.sun.azimuth);
  const el = THREE.MathUtils.degToRad(P.sun.elevation);
  uniforms.uSunDirection.value
    .set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az))
    .normalize();
  uniforms.uSunColor.value.set(P.sun.color);
  uniforms.uSunIntensity.value = P.sun.intensity;
  uniforms.uSunSharpness.value = P.sun.sharpness;
  uniforms.uSparkle.value = P.sun.sparkle;
}

function applyAll() {
  uniforms.uShallowColor.value.set(P.color.shallow);
  uniforms.uDeepColor.value.set(P.color.deep);
  uniforms.uDepthScale.value = P.color.depthScale;
  uniforms.uOpacity.value = P.color.opacity;

  uniforms.uNormalScale.value = P.normal.scale;
  uniforms.uNormalStrength.value = P.normal.strength;
  uniforms.uNormalScroll.value = P.normal.scrollSpeed;
  uniforms.uCrossAngle.value = P.normal.crossAngle;

  uniforms.uFresnelIntensity.value = P.fresnel.intensity;
  uniforms.uFresnelPower.value = P.fresnel.power;
  uniforms.uTintColor.value.set(P.fresnel.tint);

  uniforms.uFoamThreshold.value = P.foam.threshold;
  uniforms.uFoamSoftness.value = P.foam.softness;
  uniforms.uFoamIntensity.value = P.foam.intensity;
  uniforms.uFoamNoiseScale.value = P.foam.noiseScale;
  uniforms.uFoamScroll.value = P.foam.scrollSpeed;

  uniforms.uRefractionStrength.value = P.refraction.strength;
  uniforms.uRefractionFalloff.value = P.refraction.depthFalloff;
  uniforms.uEnvMode.value = P.view.envMode;
  uniforms.uSkyZenith.value.set(P.sky.zenith);
  uniforms.uSkyHorizon.value.set(P.sky.horizon);

  applyWaves();
  applySun();
}

// --- Resolusi & resize ------------------------------------------------------

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const dpr = renderer.getPixelRatio();
  renderTarget.setSize(Math.max(1, Math.floor(w * dpr)), Math.max(1, Math.floor(h * dpr)));
  uniforms.uResolution.value.set(w * dpr, h * dpr);
}
window.addEventListener('resize', resize);

// --- Panel kontrol ----------------------------------------------------------

const body = document.getElementById('panel-body');
const readout = document.getElementById('readout');
const syncedControls = [];

function readPath(path) {
  return path.split('.').reduce((obj, key) => obj[key], P);
}

function writePath(path, value) {
  const parts = path.split('.');
  const last = parts.pop();
  parts.reduce((obj, key) => obj[key], P)[last] = value;
}

function addGroup(title) {
  const group = document.createElement('section');
  group.className = 'group';
  const heading = document.createElement('h2');
  heading.textContent = title;
  group.appendChild(heading);
  body.insertBefore(group, readout);
  return group;
}

function addSlider(group, spec) {
  const row = document.createElement('div');
  row.className = 'row';

  const head = document.createElement('div');
  head.className = 'row-head';
  const label = document.createElement('label');
  label.textContent = spec.label;
  const output = document.createElement('output');
  head.append(label, output);

  const input = document.createElement('input');
  input.type = 'range';
  input.min = spec.min;
  input.max = spec.max;
  input.step = spec.step;
  input.value = readPath(spec.path);
  input.id = 'ctl-' + spec.path.replace(/\./g, '-');
  label.htmlFor = input.id;

  const format = spec.format || ((v) => v.toFixed(2));
  const sync = () => {
    const value = readPath(spec.path);
    input.value = value;
    output.textContent = format(Number(value));
  };
  sync();

  input.addEventListener('input', () => {
    writePath(spec.path, Number(input.value));
    sync();
    applyAll();
    if (spec.onInput) spec.onInput(Number(input.value));
  });

  row.append(head, input);
  group.appendChild(row);
  syncedControls.push(sync);
}

function addColor(group, spec) {
  const row = document.createElement('div');
  row.className = 'row color-row';

  const label = document.createElement('label');
  label.textContent = spec.label;
  const input = document.createElement('input');
  input.type = 'color';
  input.value = readPath(spec.path);
  input.id = 'ctl-' + spec.path.replace(/\./g, '-');
  label.htmlFor = input.id;

  input.addEventListener('input', () => {
    writePath(spec.path, input.value);
    applyAll();
  });

  row.append(label, input);
  group.appendChild(row);
  syncedControls.push(() => { input.value = readPath(spec.path); });
}

function addToggle(group, spec) {
  const row = document.createElement('div');
  row.className = 'row color-row';

  const label = document.createElement('label');
  label.textContent = spec.label;
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.checked = Boolean(readPath(spec.path));
  input.id = 'ctl-' + spec.path.replace(/\./g, '-');
  label.htmlFor = input.id;

  input.addEventListener('change', () => { writePath(spec.path, input.checked); });

  row.append(label, input);
  group.appendChild(row);
  syncedControls.push(() => { input.checked = Boolean(readPath(spec.path)); });
}

function addSelect(group, spec) {
  const row = document.createElement('div');
  row.className = 'row color-row';

  const label = document.createElement('label');
  label.textContent = spec.label;
  const select = document.createElement('select');
  select.id = 'ctl-' + spec.path.replace(/\./g, '-');
  label.htmlFor = select.id;
  for (const option of spec.options) {
    const el = document.createElement('option');
    el.value = String(option.value);
    el.textContent = option.label;
    select.appendChild(el);
  }
  select.value = String(readPath(spec.path));

  select.addEventListener('change', () => {
    writePath(spec.path, Number(select.value));
    applyAll();
  });

  row.append(label, select);
  group.appendChild(row);
  syncedControls.push(() => { select.value = String(readPath(spec.path)); });
}

// Geometri dibangun ulang dengan jeda supaya menggeser slider tidak memicu

addSlider(gSun, { path: 'sun.sharpness', label: 'Ketajaman highlight', min: 20, max: 600, step: 5, format: (v) => v.toFixed(0) });

addSlider(gView, { path: 'waves.meshSegments', label: 'Kerapatan mesh', min: SEG_MIN, max: SEG_MAX, step: 8, format: (v) => v.toFixed(0) + 'x' + v.toFixed(0), onInput: scheduleRebuild });
addSlider(gView, { path: 'waves.meshSize', label: 'Ukuran bidang', min: 80, max: 500, step: 5, format: (v) => v.toFixed(0) + ' m', onInput: scheduleRebuild });
addColor(gView, { path: 'sky.zenith', label: 'Langit zenith' });

addSelect(gView, { path: 'view.envMode', label: 'Mode lingkungan', options: [{ value: 0, label: 'Langit prosedural' }, { value: 1, label: 'Gelap (uji fresnel)' }] });
addToggle(gView, { path: 'view.autoRotate', label: 'Kamera berputar' });
addToggle(gView, { path: 'view.paused', label: 'Jeda waktu' });

// --- Preset -----------------------------------------------------------------

const presetButtons = Array.from(document.querySelectorAll('.preset'));

function applyPreset(name) {
  deepMerge(P, PRESETS[name]);
  for (const sync of syncedControls) sync();
  applyAll();
  rebuildWaterMesh();
  for (const button of presetButtons) {
    button.setAttribute('aria-pressed', String(button.dataset.preset === name));
  }
}

for (const button of presetButtons) {
  button.addEventListener('click', () => applyPreset(button.dataset.preset));
}

// --- Panel lipat di layar kecil --------------------------------------------

const panel = document.getElementById('panel');
const panelToggle = document.getElementById('panel-toggle');
const narrow = window.matchMedia('(max-width: 720px)');

function syncPanelMode() {
  if (narrow.matches) {
    panel.dataset.collapsed = panel.dataset.collapsed ?? 'true';
  } else {
    delete panel.dataset.collapsed;
  }
  panelToggle.setAttribute('aria-expanded', String(panel.dataset.collapsed !== 'true'));
  panelToggle.textContent = panel.dataset.collapsed === 'true' ? 'Tampilkan kontrol' : 'Sembunyikan kontrol';
}

panelToggle.addEventListener('click', () => {
  panel.dataset.collapsed = panel.dataset.collapsed === 'true' ? 'false' : 'true';
  syncPanelMode();
});

narrow.addEventListener('change', syncPanelMode);
syncPanelMode();

// --- Baca angka -------------------------------------------------------------

let fps = 60;
let frameAccum = 0;
let frameCount = 0;

const clock = new THREE.Clock();
let elapsed = 0;

function updateReadout() {
  const amp = P.waves.amplitude * (0.55 + 0.45 * P.waves.steepness);
  const crestHeight = (P.waves.amplitude * (1 + 0.72 + 0.5) * 0.5).toFixed(2);
  const foamWidth = (P.foam.softness / Math.max(P.foam.threshold, 0.01)).toFixed(2);
  const specSharp = P.sun.sharpness.toFixed(0);
  const verts = ((P.waves.meshSegments + 1) ** 2 / 1000).toFixed(0);

  readout.innerHTML =
    'Puncak gelombang&nbsp;&nbsp;' + crestHeight + ' m<br>' +
    'Lebar pita buih&nbsp;&nbsp;&nbsp;' + foamWidth + ' (soft/ambang)<br>' +
    'Highlight&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + specSharp + ' (eksponen)<br>' +
    'Vertex air&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + verts + 'k<br>' +
    'FPS&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + fps.toFixed(0) +
    ' | ' + amp.toFixed(2) + ' amp. efektif';
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!P.view.paused) elapsed += dt;

  frameAccum += dt;
  frameCount++;
  if (frameAccum >= 0.5) {
    fps = frameCount / frameAccum;
    frameAccum = 0;
    frameCount = 0;
    updateReadout();
  }

  uniforms.uTime.value = elapsed;
  uniforms.uCameraPosition.value.copy(camera.position);
  controls.autoRotate = P.view.autoRotate;
  controls.update();

  // Dua pass: scene tanpa air ke render target, lalu air ke layar membaca target itu.
  water.visible = false;
  renderer.setRenderTarget(renderTarget);
  renderer.render(scene, camera);

  water.visible = true;
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);

  requestAnimationFrame(tick);
}

applyAll();
resize();
updateReadout();
tick();

// Dipakai skrip uji otomasi untuk tahu frame pertama sudah dirender.
window.__waterReady = true;
window.__water = { P, uniforms, water, renderer, camera, applyPreset, applyAll };
</script>
